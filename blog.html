<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<title>Writing — Devakh Rashie</title>
<meta name="robots" content="noindex">
<!-- Old share links looked like blog.html#<slug>; each post now lives at /blog/<slug>. -->
<script>
  var slug = location.hash.slice(1);
  location.replace(/^[a-z0-9-]+$/.test(slug) ? "/blog/" + slug : "/");
</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
<p><a href="/">devrashie.space</a></p>
</body>
</html>
